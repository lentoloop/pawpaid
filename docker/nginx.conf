worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    limit_req_zone $binary_remote_addr zone=webhook_ip:1m rate=20r/m;
    # Lane classification requires the local payouts lookup. The application owns the
    # 540 uncorrelated / 600 total ceiling with 60 reserved slots; no shared edge refusal.
    # Deployment-specific trusted ingress CIDRs belong in this optional file.
    # Configure set_real_ip_from + real_ip_header there; never trust arbitrary peers.
    include /etc/nginx/real-ip.d/*.conf;
    server {
        listen 8080;
        server_tokens off;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        root /usr/share/nginx/html;
        location = /health { proxy_pass http://127.0.0.1:3000/health; }
        location = /webhooks/paypal/sandbox {
            limit_req zone=webhook_ip burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 128k;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://127.0.0.1:3000;
        }
        location /api/ { proxy_set_header X-Real-IP $remote_addr; proxy_pass http://127.0.0.1:3000; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
